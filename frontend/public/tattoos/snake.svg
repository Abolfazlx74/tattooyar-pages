<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#18181b" stroke="#fafafa" stroke-width="2">
    <!-- Cobra Flared Hood -->
    <path d="M 256,60 C 230,60 215,80 210,105 C 190,130 160,170 165,220 C 170,260 210,280 240,285 L 240,320 C 210,330 180,360 190,410 C 200,450 250,460 280,440 C 310,420 310,380 285,360 C 270,350 270,330 272,320 L 272,285 C 302,280 342,260 347,220 C 352,170 322,130 302,105 C 297,80 282,60 256,60 Z" fill="#18181b"/>
    <!-- Head crown -->
    <path d="M 256,50 L 235,90 L 277,90 Z" fill="#09090b"/>
    <!-- Hood markings (spectacle pattern) -->
    <circle cx="215" cy="180" r="22" fill="#fafafa"/>
    <circle cx="215" cy="180" r="14" fill="#18181b"/>
    <circle cx="297" cy="180" r="22" fill="#fafafa"/>
    <circle cx="297" cy="180" r="14" fill="#18181b"/>
    <path d="M 215,195 Q 256,230 297,195" fill="none" stroke="#fafafa" stroke-width="6"/>

    <!-- Snake Belly Ventral Plates -->
    <line x1="240" y1="290" x2="272" y2="290" stroke="#fafafa" stroke-width="3"/>
    <line x1="240" y1="305" x2="272" y2="305" stroke="#fafafa" stroke-width="3"/>
    <line x1="242" y1="320" x2="270" y2="320" stroke="#fafafa" stroke-width="3"/>
    <line x1="244" y1="335" x2="268" y2="335" stroke="#fafafa" stroke-width="3"/>

    <!-- Coiled Tail tail loops -->
    <path d="M 250,450 C 230,480 280,500 310,480 C 340,460 360,420 340,380 C 325,350 280,340 260,370" fill="none" stroke="#18181b" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Eyes & Forked Tongue -->
    <circle cx="238" cy="85" r="4" fill="#fafafa"/>
    <circle cx="274" cy="85" r="4" fill="#fafafa"/>
    <path d="M 256,50 L 256,25 L 245,10 M 256,25 L 267,10" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>