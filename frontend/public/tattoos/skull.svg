<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#18181b">
    <!-- Skull Cranium -->
    <path d="M 256,60 C 180,60 140,110 140,180 C 140,230 160,250 170,270 C 180,290 185,310 195,330 L 317,330 C 327,310 332,290 342,270 C 352,250 372,230 372,180 C 372,110 332,60 256,60 Z"/>
    <!-- Maxilla / Teeth row -->
    <path d="M 195,330 L 195,370 L 317,370 L 317,330 Z"/>
  </g>
  <!-- Eye sockets (cutout transparent) -->
  <g fill="#fafafa">
    <path d="M 185,180 C 175,220 205,245 225,230 C 240,220 230,180 210,175 C 195,170 185,175 185,180 Z" fill="#fafafa"/>
    <path d="M 327,180 C 337,220 307,245 287,230 C 272,220 282,180 302,175 C 317,170 327,175 327,180 Z" fill="#fafafa"/>
    <!-- Nasal cavity -->
    <polygon points="256,220 244,265 256,275 268,265"/>
    <!-- Teeth separations -->
    <rect x="212" y="325" width="4" height="40" rx="2"/>
    <rect x="232" y="325" width="4" height="40" rx="2"/>
    <rect x="254" y="325" width="4" height="40" rx="2"/>
    <rect x="276" y="325" width="4" height="40" rx="2"/>
    <rect x="296" y="325" width="4" height="40" rx="2"/>
    <line x1="195" y1="345" x2="317" y2="345" stroke="#18181b" stroke-width="4"/>
  </g>

  <!-- Blooming Rose at the base -->
  <g fill="#18181b" stroke="#fafafa" stroke-width="3">
    <!-- Center Rose Petals -->
    <path d="M 256,400 C 230,370 282,370 256,400 Z"/>
    <path d="M 256,380 C 220,380 220,430 256,440 C 292,430 292,380 256,380 Z"/>
    <path d="M 220,400 C 180,410 190,460 235,465 C 245,465 240,430 220,400 Z"/>
    <path d="M 292,400 C 332,410 322,460 277,465 C 267,465 272,430 292,400 Z"/>
    <path d="M 210,440 C 170,460 200,500 256,495 C 312,500 342,460 302,440 C 330,480 280,505 256,500 C 232,505 182,480 210,440 Z"/>
    <!-- Rose Thorns and Leaves -->
    <path d="M 160,420 C 110,410 90,460 140,470 C 160,475 165,450 160,420 Z" fill="#09090b"/>
    <path d="M 352,420 C 402,410 422,460 372,470 C 352,475 347,450 352,420 Z" fill="#09090b"/>
  </g>
</svg>