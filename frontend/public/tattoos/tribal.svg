    <rect x="20" y="100" width="472" height="14" rx="3"/>
    <rect x="20" y="398" width="472" height="14" rx="3"/>
    
    <!-- Row of shark teeth triangles (Niho Mano) top -->
    <polygon points="30,125 50,155 70,125 90,155 110,125 130,155 150,125 170,155 190,125 210,155 230,125 250,155 270,125 290,155 310,125 330,155 350,125 370,155 390,125 410,155 430,125 450,155 470,125 480,125 480,118 30,118"/>
    <!-- Row of shark teeth triangles bottom -->
    <polygon points="30,387 50,357 70,387 90,357 110,387 130,357 150,387 170,357 190,387 210,357 230,387 250,357 270,387 290,357 310,387 330,357 350,387 370,357 390,387 410,357 430,387 450,357 470,387 480,387 480,394 30,394"/>

    <!-- Central interlocking Polynesian Spearheads & Spiral glyphs -->
    <path d="M 60,256 L 100,180 L 140,256 L 100,332 Z"/>
    <path d="M 180,256 L 220,180 L 260,256 L 220,332 Z"/>
    <path d="M 300,256 L 340,180 L 380,256 L 340,332 Z"/>
    <path d="M 420,256 L 460,180 L 500,256 L 460,332 Z"/>

