<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#18181b" stroke="#18181b" stroke-linejoin="round">
    <!-- Dragon Head -->
    <path d="M 380,80 C 350,60 300,70 280,100 C 265,120 280,140 270,160 C 260,175 230,175 220,190 C 210,205 225,225 240,225 C 260,225 270,210 290,210 C 310,210 325,230 350,220 C 375,210 380,180 370,160 C 390,150 410,130 400,105 Z"/>
    
    <!-- Horns & Whiskers -->
    <path d="M 360,70 Q 420,20 460,30 Q 410,50 375,80 Z" fill="#09090b"/>
    <path d="M 340,65 Q 380,15 410,10 Q 380,35 350,75 Z" fill="#09090b"/>
    <path d="M 230,200 Q 180,210 140,190 Q 175,220 235,210 Z" fill="#09090b"/>
    <path d="M 240,215 Q 170,245 130,260 Q 175,255 245,225 Z" fill="#09090b"/>
    
    <!-- Dragon Eyes & Snout details (cutout) -->
    <circle cx="320" cy="115" r="7" fill="#fafafa"/>
    <circle cx="321" cy="115" r="3" fill="#18181b"/>
    <!-- Teeth -->
    <polygon points="260,210 270,225 275,210" fill="#fafafa"/>
    <polygon points="280,210 290,225 295,210" fill="#fafafa"/>
    <polygon points="305,210 315,223 320,210" fill="#fafafa"/>

    <!-- Serpentine Body Swirls -->
    <path d="M 340,190 C 370,230 420,260 410,320 C 400,370 330,370 310,320 C 290,280 270,250 220,260 C 170,270 140,320 160,380 C 180,440 250,440 280,470 C 260,475 220,470 180,450 C 120,410 110,330 140,260 C 170,200 230,220 270,180 Z" fill="#18181b"/>
    
    <!-- Spine dorsal fins -->
    <path d="M 380,210 L 415,200 L 390,230 L 430,240 L 395,260 L 430,280 L 390,295 L 420,325 L 375,325 Z" fill="#09090b"/>
    <path d="M 170,260 L 140,230 L 160,270 L 120,260 L 150,290 L 110,300 L 145,325 L 115,350 L 155,360 Z" fill="#09090b"/>
    <path d="M 170,410 L 150,440 L 190,430 L 180,465 L 215,445 L 220,480 L 250,455 Z" fill="#09090b"/>

    <!-- Claws / Paws -->
    <g fill="#18181b">
      <!-- Front Claw -->
      <path d="M 280,240 C 260,260 230,280 200,290 C 190,275 195,260 215,255 L 180,260 L 210,245 L 175,240 L 215,235 C 235,230 260,235 280,240 Z"/>
      <!-- Back Claw -->
      <path d="M 290,410 C 320,420 350,420 380,400 C 370,390 350,395 345,380 L 375,370 L 340,365 L 365,350 L 335,355 C 320,365 305,390 290,410 Z"/>
    </g>

    <!-- Swirling Clouds & Flame Tendrils -->
    <path d="M 90,160 C 120,140 160,150 170,180 C 150,185 130,175 110,185 C 90,195 80,180 90,160 Z" fill="#27272a"/>
    <path d="M 400,380 C 440,360 470,390 450,430 C 430,415 425,400 405,405 C 390,410 390,390 400,380 Z" fill="#27272a"/>
    <path d="M 280,460 C 310,480 350,490 380,470 C 350,460 330,470 310,455 Z" fill="#27272a"/>
  </g>
</svg>