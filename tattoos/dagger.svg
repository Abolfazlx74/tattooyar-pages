<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="#18181b">
    <!-- Pommel & Hilt -->
    <circle cx="256" cy="50" r="20" fill="#09090b"/>
    <circle cx="256" cy="50" r="10" fill="#fafafa"/>
    <!-- Grip -->
    <rect x="248" y="70" width="16" height="70" rx="3" fill="#18181b"/>
    <line x1="248" y1="85" x2="264" y2="85" stroke="#fafafa" stroke-width="3"/>
    <line x1="248" y1="105" x2="264" y2="105" stroke="#fafafa" stroke-width="3"/>
    <line x1="248" y1="125" x2="264" y2="125" stroke="#fafafa" stroke-width="3"/>
    <!-- Crossguard -->
    <path d="M 170,140 C 220,135 240,150 256,150 C 272,150 292,135 342,140 C 352,145 350,160 335,160 C 295,160 275,155 256,160 C 237,155 217,160 177,160 C 162,160 160,145 170,140 Z"/>
    
    <!-- Blade -->
    <polygon points="246,160 266,160 264,430 256,470 248,430" fill="#27272a"/>
    <polygon points="256,160 266,160 264,430 256,470" fill="#09090b"/>
    <!-- Center fuller line -->
    <line x1="256" y1="165" x2="256" y2="440" stroke="#fafafa" stroke-width="2"/>

    <!-- Entwined Serpent around the blade -->
    <path d="M 230,170 C 280,180 320,200 300,230 C 280,260 210,240 220,280 C 230,320 310,300 290,350 C 270,390 220,380 250,420" fill="none" stroke="#18181b" stroke-width="22" stroke-linecap="round"/>
    <path d="M 230,170 C 280,180 320,200 300,230 C 280,260 210,240 220,280 C 230,320 310,300 290,350 C 270,390 220,380 250,420" fill="none" stroke="#fafafa" stroke-width="4" stroke-dasharray="10 8"/>
    <!-- Snake Head -->
    <path d="M 215,160 C 205,140 235,130 250,140 C 240,165 225,170 215,160 Z" fill="#09090b"/>
  </g>
</svg>