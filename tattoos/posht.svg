<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      .bold-persian {
        font-family: 'Segoe UI', Tahoma, -apple-system, sans-serif;
        font-weight: 900;
        fill: #18181b;
        text-anchor: middle;
        direction: rtl;
      }
    </style>
  </defs>
  <!-- Accent dagger and filigree -->
  <g fill="#18181b" stroke="#18181b">
    <!-- Top divider -->
    <path d="M 120,180 L 230,180 L 256,170 L 282,180 L 392,180" fill="none" stroke-width="3" stroke-linecap="round"/>
    <circle cx="256" cy="170" r="4" fill="#18181b"/>
    <circle cx="120" cy="180" r="3" fill="#18181b"/>
    <circle cx="392" cy="180" r="3" fill="#18181b"/>
  </g>

  <!-- Main text lines -->
  <text x="256" y="235" class="bold-persian" font-size="30" letter-spacing="-0.5px">ظرفیت پشت پر است،</text>
  <text x="256" y="295" class="bold-persian" font-size="34" letter-spacing="-0.5px">از جلو خنجر بزنید</text>

  <!-- Bottom decorative dagger / ornament -->
  <g fill="#18181b" stroke="#18181b">
    <path d="M 140,335 L 235,335 L 256,345 L 277,335 L 372,335" fill="none" stroke-width="3" stroke-linecap="round"/>
    <polygon points="256,355 251,340 261,340" fill="#18181b"/>
    <circle cx="140" cy="335" r="3" fill="#18181b"/>
    <circle cx="372" cy="335" r="3" fill="#18181b"/>
  </g>
</svg>